{% extends 'base.html' %}
{% block title %}Usuarios{% endblock %}

{% block content %}
<h2>Lista de Usuarios</h2>
<ul>
    {% for u in users %}
        <li>
            <a href="{{ url_for('users.profile', id=u.id) }}">{{ u.username }}</a> - {{ u.email }}
        </li>
    {% else %}
        <li>No hay usuarios registrados.</li>
    {% endfor %}
</ul>
{% endblock %}
