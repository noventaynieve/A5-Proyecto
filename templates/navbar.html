<nav>
    <a href="{{ url_for('users.user_list') }}" class="brand">AppManager</a>
    <div class="nav-links">
        {% if session.get('user_id') %}
            <span>Hola, <strong>{{ session.get('username') }}</strong></span>
            <a href="{{ url_for('users.profile', id=session.get('user_id')) }}">Mi Perfil</a>
            <a href="{{ url_for('users.user_list') }}">Usuarios</a>
            <a href="{{ url_for('users.logout') }}">Cerrar Sesión</a>
        {% else %}
            <a href="{{ url_for('users.login') }}">Iniciar Sesión</a>
            <a href="{{ url_for('users.register') }}" class="btn btn-primary" style="padding: 0.4rem 1rem; color: white;">Registrarse</a>
        {% endif %}
    </div>
</nav>
