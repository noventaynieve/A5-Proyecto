{% extends 'base.html' %}
{% block title %}Perfil{% endblock %}

{% block content %}
<h2>Perfil de {{ user.username }}</h2>
<p><strong>ID:</strong> {{ user.id }}</p>
<p><strong>Usuario:</strong> {{ user.username }}</p>
<p><strong>Email:</strong> {{ user.email }}</p>

{% if session.get('user_id') == user.id %}
    <a href="{{ url_for('users.edit_profile', id=user.id) }}">Editar Perfil</a>
    <br><br>
    <form action="{{ url_for('users.delete_user', id=user.id) }}" method="POST" onsubmit="return confirm('¿Seguro que deseas eliminar tu cuenta?');">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" style="color: red;">Eliminar Cuenta</button>
    </form>
{% endif %}
{% endblock %}
