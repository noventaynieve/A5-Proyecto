{% extends 'base.html' %}
{% block title %}Editar Perfil{% endblock %}

{% block content %}
<h2>Editar Perfil</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    <p>
        {{ form.username.label }}<br>
        {{ form.username(size=30) }}
    </p>
    <p>
        {{ form.email.label }}<br>
        {{ form.email(size=30) }}
    </p>
    <p>{{ form.submit() }}</p>
</form>
{% endblock %}
